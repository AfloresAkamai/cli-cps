---
# #######################################
# Basic Cert Info (DO NOT MODIFY)
# #######################################
validationType: third-party
ra: third-party
certificateType: third-party
certificateChainType: default
thirdParty:
  excludeSans: true
# #######################################
# Akamai Defaults (MODIFY IF NEEDED, OTHERWISE LEAVE AS DEFAULT)
# #######################################
enableMultiStackedCertificates: false
signatureAlgorithm: SHA-256
networkConfiguration:
  # edgesuite.net/akamaized.net is standard-tls / edgekey.net is enhanced-tls
  secureNetwork: standard-tls
  geography: core
  # SNI setting is sniOnly
  sniOnly: true
  quicEnabled: true
  mustHaveCiphers: ak-akamai-default-2020q1
  preferredCiphers: ak-akamai-default-2020q1
  disallowedTlsVersions: []
  dnsNameSettings:
    cloneDnsNames: true
    dnsNames:
    - <FILLIN>
    - <FILLIN AS NEEDED>

# #######################################
# Customer Edit (PLEASE UPDATE BELOW)
# (ANY STRING VALUES THAT START WITH 0 SHOULD USE DOUBLE QUOTES: "")
# #######################################
# Change Management (true or false)
changeManagement: false
# Technical Contact Info
techContact:
  firstName: <FILLIN>
  lastName: <FILLIN>
  title: <FILLIN>
  email: <FILLIN>
  phone: <FILLIN>
  organizationName: <FILLIN>
  addressLineOne: <FILLIN>
  addressLineTwo: <FILLIN>
  country: <FILLIN>
  city: <FILLIN>
  region: <FILLIN>
  postalCode: <FILLIN>
# Admin Contact
adminContact:
  firstName: <FILLIN>
  lastName: <FILLIN>
  title: <FILLIN>
  email: <FILLIN>
  phone: <FILLIN>
  organizationName: <FILLIN>
  addressLineOne: <FILLIN>
  addressLineTwo: <FILLIN>
  country: <FILLIN>
  city: <FILLIN>
  region: <FILLIN>
  postalCode: <FILLIN>
# Org Info
org:
  name: <FILLIN>
  addressLineOne: <FILLIN>
  addressLineTwo: <FILLIN>
  country: <FILLIN>
  city: <FILLIN>
  region: <FILLIN>
  postalCode: <FILLIN>
  phone: <FILLIN>  
# CSR Info
csr:
  #Common Name (CN)
  cn: <FILLIN>
  #Organization
  o: <FILLIN>
  #Organization Unit (OU)
  ou: <FILLIN>
  #Country
  c: <FILLIN>
  #Locality
  l: <FILLIN>
  #State Province Name
  st: <FILLIN>
  # Specify at list of SAN entries (at least 1 should be specified)
  # - san entry 1
  # - san entry 2
  sans:
  - <FILLIN>
  - <FILLIN AS NEEDED>
# #######################################
